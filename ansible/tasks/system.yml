---
- name: Set the devbox hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Resolve the local hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"

- name: Install base tools
  ansible.builtin.apt:
    name: [build-essential, ca-certificates, curl, git, libatomic1, openssh-server, tmux]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set UTF-8 locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: LANG=C.UTF-8
    create: true
    mode: '0644'

- name: Prepare repository key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Inspect the swap disk
  ansible.builtin.command: wipefs --no-act --noheadings --output TYPE /dev/disk/by-id/virtio-devbox-swap
  register: swap_signature
  changed_when: false

- name: Refuse to touch a swap disk that holds data
  ansible.builtin.assert:
    that: swap_signature.stdout in ['', 'swap']
    fail_msg: "Unexpected signature on devbox-swap: {{ swap_signature.stdout }}"

- name: Format the swap disk
  ansible.builtin.command: mkswap --label devbox-swap /dev/disk/by-id/virtio-devbox-swap
  when: swap_signature.stdout == ''

- name: Mount swap at boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/dev/disk/by-id/virtio-devbox-swap\s'
    line: /dev/disk/by-id/virtio-devbox-swap none swap sw,nofail 0 0

- name: Enable swap now
  ansible.builtin.command: swapon --all
  when: ansible_facts.swaptotal_mb == 0

- name: Install earlyoom
  ansible.builtin.apt:
    name: earlyoom
    state: present

- name: Run earlyoom
  ansible.builtin.service:
    name: earlyoom
    state: started
    enabled: true
