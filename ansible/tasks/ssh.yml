---
- name: Configure key-only non-root SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-devbox.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: '0644'
  notify: Reload SSH
- name: Enable SSH
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
