---
- name: Preserve SSH identity across cloud-init metadata updates
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-devbox-ssh-identity.cfg
    content: |
      ssh_deletekeys: false
    mode: '0644'

- name: Configure key-only non-root SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-devbox.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: '0644'
  notify: Reload SSH

- name: Enable SSH
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
